<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <!-- 確保手機版畫面比例正確且不可縮放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#020617">
    <title>BrainSync 私人知識庫</title>
    
    <!-- 載入 Tailwind CSS 進行美化 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 Lucide Icons 圖示庫 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .toast-enter { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn { from { transform: translate(-50%, -100%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
    </style>

    <script>
        // 【黑科技】動態生成 PWA Manifest，讓 Android 可以將此網頁當作原生 App 安裝
        const manifest = {
            "name": "BrainSync",
            "short_name": "BrainSync",
            "start_url": ".",
            "display": "standalone",
            "background_color": "#020617",
            "theme_color": "#020617",
            "icons": [{
                "src": "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2334d399'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM11 19.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.22.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z'/></svg>",
                "sizes": "192x192",
                "type": "image/svg+xml"
            }]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
        const manifestUrl = URL.createObjectURL(manifestBlob);
        document.write(`<link rel="manifest" href="${manifestUrl}">`);
    </script>
</head>
<body class="h-screen flex justify-center overflow-hidden">
    <!-- App 主容器 -->
    <div class="w-full max-w-md bg-slate-950 h-full flex flex-col relative shadow-2xl">
        
        <!-- 頂部導航列 -->
        <header class="px-5 pt-6 pb-4 bg-slate-900 border-b border-slate-800 shrink-0 flex items-center justify-between sticky top-0 z-20">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-emerald-400 to-blue-500 flex items-center justify-center shadow-lg">
                    <i data-lucide="brain-circuit" class="w-5 h-5 text-white"></i>
                </div>
                <h1 class="text-xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-emerald-100 to-blue-100">
                    BrainSync
                </h1>
            </div>
            <button onclick="openSettings()" class="p-2 text-slate-400 hover:text-white rounded-full">
                <i data-lucide="settings" class="w-5 h-5"></i>
            </button>
        </header>

        <!-- 主要內容區 -->
        <main class="flex-1 overflow-y-auto pb-24 relative" id="main-content">
            
            <!-- 區塊 1: Brain Dump (大腦清空區) -->
            <div id="tab-braindump" class="flex flex-col h-full p-5 space-y-6">
                <div class="space-y-2">
                    <h2 class="text-2xl font-bold text-white">清空大腦</h2>
                    <p class="text-sm text-slate-400">快速記錄靈感、待辦事項。AI 會自動為你分類與摘要。</p>
                </div>
                <div class="flex-1 relative flex flex-col">
                    <textarea id="bd-text" placeholder="現在在想什麼？點擊下方麥克風直接用說的..." class="flex-1 w-full bg-slate-900/50 border border-slate-700/50 rounded-3xl p-6 text-lg text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500/50 transition-all resize-none shadow-inner"></textarea>
                    
                    <div class="absolute bottom-6 left-0 w-full flex justify-center items-center space-x-4 px-6">
                        <!-- 語音麥克風按鈕 -->
                        <button id="btn-mic" onclick="toggleMic()" class="p-4 rounded-full bg-slate-800 text-emerald-400 border border-slate-700 shadow-xl transition-all">
                            <i data-lucide="mic" class="w-7 h-7" id="icon-mic"></i>
                        </button>
                        <!-- 儲存按鈕 -->
                        <button onclick="saveBrainDump()" class="flex-1 bg-emerald-600 active:bg-emerald-500 text-white py-4 rounded-2xl font-bold text-lg flex items-center justify-center space-x-2 transition-all shadow-lg shadow-emerald-900/20">
                            <span id="bd-btn-text">存入大腦</span>
                            <i data-lucide="send" class="w-5 h-5 ml-2" id="bd-btn-icon"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 區塊 2: Smart Note (深度筆記區) -->
            <div id="tab-smartnote" class="hidden flex flex-col h-full p-5 space-y-6">
                <div class="space-y-2">
                    <h2 class="text-2xl font-bold text-white">深度筆記</h2>
                    <p class="text-sm text-slate-400">貼上長文、網址，或上傳圖片，讓 Gemini AI 幫你萃取精華。</p>
                </div>
                <div class="flex-1 flex flex-col space-y-4">
                    <textarea id="sn-text" placeholder="貼上網址、長文，或是與 AI 的長篇對話..." class="flex-1 min-h-[200px] w-full bg-slate-900/50 border border-slate-700/50 rounded-2xl p-5 text-base text-slate-100 placeholder-slate-600 focus:outline-none focus:border-blue-500/50 transition-all resize-none"></textarea>
                    
                    <!-- 圖片預覽區 -->
                    <div id="sn-img-preview-container" class="hidden relative w-full h-40 rounded-xl overflow-hidden border border-slate-700 bg-slate-900">
                        <img id="sn-img-preview" src="" class="object-cover w-full h-full opacity-80" />
                        <button onclick="clearImage()" class="absolute top-2 right-2 bg-black/60 p-2 rounded-full text-white backdrop-blur-sm">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                    </div>

                    <div class="flex items-center space-x-3">
                        <input type="file" id="sn-file" accept="image/*" class="hidden" onchange="handleImage(event)" />
                        <button onclick="document.getElementById('sn-file').click()" class="p-4 bg-slate-800 rounded-2xl text-blue-400 border border-slate-700">
                            <i data-lucide="image" class="w-6 h-6"></i>
                        </button>
                        <button onclick="saveSmartNote()" class="flex-1 bg-blue-600 active:bg-blue-500 text-white py-4 rounded-2xl font-bold flex items-center justify-center space-x-2 shadow-lg">
                            <span id="sn-btn-text">AI 智能分析與儲存</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 區塊 3: Library (個人圖書館) -->
            <div id="tab-library" class="hidden flex flex-col h-full">
                <div class="p-5 pb-2 space-y-4 sticky top-0 bg-slate-950/95 backdrop-blur-md z-10 border-b border-slate-800/50">
                    <div class="relative">
                        <i data-lucide="search" class="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                        <input type="text" id="search-input" onkeyup="renderLibrary()" placeholder="搜尋筆記..." class="w-full bg-slate-900 border border-slate-800 rounded-2xl py-3.5 pl-12 pr-4 text-slate-200 focus:outline-none focus:border-purple-500" />
                    </div>
                    <!-- 標籤過濾器 -->
                    <div id="tags-container" class="flex space-x-2 overflow-x-auto pb-2 scrollbar-hide">
                        <!-- Tags 會在這裡渲染 -->
                    </div>
                </div>
                <div id="notes-container" class="px-5 py-4 space-y-5 pb-10">
                    <!-- 筆記會在這裡渲染 -->
                </div>
            </div>
        </main>

        <!-- 底部切換導覽列 -->
        <nav class="absolute bottom-0 w-full bg-slate-900/90 backdrop-blur-xl border-t border-slate-800 pb-safe z-30">
            <div class="flex justify-around items-center h-20 px-2">
                <button onclick="switchTab('braindump')" id="nav-braindump" class="nav-btn flex flex-col items-center justify-center w-full h-full space-y-1 text-emerald-400">
                    <div class="p-1.5 rounded-full bg-slate-800 nav-icon-bg"><i data-lucide="brain-circuit" class="w-6 h-6"></i></div>
                    <span class="text-[10px] font-bold tracking-wide">Brain Dump</span>
                </button>
                <button onclick="switchTab('smartnote')" id="nav-smartnote" class="nav-btn flex flex-col items-center justify-center w-full h-full space-y-1 text-slate-500">
                    <div class="p-1.5 rounded-full nav-icon-bg"><i data-lucide="file-text" class="w-6 h-6"></i></div>
                    <span class="text-[10px] font-bold tracking-wide">Smart Note</span>
                </button>
                <button onclick="switchTab('library')" id="nav-library" class="nav-btn flex flex-col items-center justify-center w-full h-full space-y-1 text-slate-500">
                    <div class="p-1.5 rounded-full nav-icon-bg"><i data-lucide="library" class="w-6 h-6"></i></div>
                    <span class="text-[10px] font-bold tracking-wide">Library</span>
                </button>
            </div>
        </nav>

        <!-- 設定視窗 (API Key) -->
        <div id="settings-modal" class="hidden absolute inset-0 bg-slate-950/90 backdrop-blur-sm z-50 flex items-center justify-center p-5">
            <div class="bg-slate-900 border border-slate-800 p-6 rounded-3xl w-full max-w-sm shadow-2xl">
                <h3 class="text-xl font-bold text-white mb-2">綁定你的大腦 (AI)</h3>
                <p class="text-sm text-slate-400 mb-5">請輸入你的 Gemini API Key 以啟用 AI 摘要與分類功能。資料與密碼僅儲存在你的手機上。</p>
                <input type="password" id="api-key-input" placeholder="貼上 API Key..." class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white mb-4">
                <p class="text-xs text-slate-500 mb-5">不知去哪申請？<a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-blue-400 underline">點此免費獲取</a></p>
                <div class="flex space-x-3">
                    <button onclick="closeSettings()" class="flex-1 py-3 bg-slate-800 text-white rounded-xl font-bold">取消</button>
                    <button onclick="saveSettings()" class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold">儲存設定</button>
                </div>
            </div>
        </div>

        <!-- 系統通知 (Toast) -->
        <div id="toast" class="hidden fixed top-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-5 py-3 rounded-full shadow-2xl z-[60] text-sm flex items-center border border-slate-700 toast-enter w-max max-w-[90%]">
            <i data-lucide="info" class="w-4 h-4 mr-2 text-emerald-400"></i>
            <span id="toast-msg"></span>
        </div>
    </div>

    <!-- 應用程式邏輯 -->
    <script>
        // --- 狀態管理 (使用 Local Storage，確保資料都在本機) ---
        let notes = JSON.parse(localStorage.getItem('brainsync_notes')) || [];
        let apiKey = localStorage.getItem('brainsync_apikey') || '';
        let currentImageBase64 = null;
        let selectedTag = null;
        
        // 初始化 Icons
        lucide.createIcons();
        if (!apiKey) openSettings();
        
        // --- 介面控制邏輯 ---
        function switchTab(tabId) {
            ['braindump', 'smartnote', 'library'].forEach(id => {
                document.getElementById(`tab-${id}`).classList.add('hidden');
                document.getElementById(`nav-${id}`).classList.remove('text-emerald-400', 'text-blue-400', 'text-purple-400');
                document.getElementById(`nav-${id}`).classList.add('text-slate-500');
                document.getElementById(`nav-${id}`).querySelector('.nav-icon-bg').classList.remove('bg-slate-800');
            });
            
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            const navBtn = document.getElementById(`nav-${tabId}`);
            navBtn.classList.remove('text-slate-500');
            navBtn.querySelector('.nav-icon-bg').classList.add('bg-slate-800');
            
            if(tabId === 'braindump') navBtn.classList.add('text-emerald-400');
            if(tabId === 'smartnote') navBtn.classList.add('text-blue-400');
            if(tabId === 'library') {
                navBtn.classList.add('text-purple-400');
                renderLibrary();
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        function openSettings() {
            document.getElementById('api-key-input').value = apiKey;
            document.getElementById('settings-modal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
        }

        function saveSettings() {
            apiKey = document.getElementById('api-key-input').value.trim();
            localStorage.setItem('brainsync_apikey', apiKey);
            closeSettings();
            showToast("API Key 已儲存");
        }

        // --- 語音輸入 (Web Speech API) ---
        let recognition = null;
        let isListening = false;
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'cmn-Hant-TW'; // 繁體中文
            
            recognition.onresult = (event) => {
                let finalTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
                }
                if (finalTranscript) {
                    const textEl = document.getElementById('bd-text');
                    textEl.value += (textEl.value ? ' ' : '') + finalTranscript;
                }
            };
            recognition.onend = () => {
                isListening = false;
                updateMicUI();
            };
        }

        function toggleMic() {
            if (!recognition) return showToast("您的瀏覽器不支援語音功能");
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
                isListening = true;
            }
            updateMicUI();
        }

        function updateMicUI() {
            const btn = document.getElementById('btn-mic');
            if (isListening) {
                btn.classList.replace('bg-slate-800', 'bg-red-500');
                btn.classList.replace('text-emerald-400', 'text-white');
                btn.classList.add('animate-pulse');
            } else {
                btn.classList.replace('bg-red-500', 'bg-slate-800');
                btn.classList.replace('text-white', 'text-emerald-400');
                btn.classList.remove('animate-pulse');
            }
        }

        // --- 圖片處理 (壓縮與預覽) ---
        function handleImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 800; // 壓縮圖片以免 LocalStorage 爆掉
                    let width = img.width; let height = img.height;
                    if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
                    else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    currentImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    
                    document.getElementById('sn-img-preview').src = currentImageBase64;
                    document.getElementById('sn-img-preview-container').classList.remove('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function clearImage() {
            currentImageBase64 = null;
            document.getElementById('sn-file').value = '';
            document.getElementById('sn-img-preview-container').classList.add('hidden');
        }

        // --- 串接 Gemini AI 進行自動分類與摘要 ---
        async function analyzeWithAI(text, base64Img) {
            if (!apiKey) {
                openSettings();
                throw new Error("請先填寫 API Key");
            }
            
            // 使用 gemini-1.5-flash 模型處理文字與圖片
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            const prompt = `你是一個極高效率的私人知識庫整理助手。請分析以下使用者提供的內容：
            1. 給出一句話的重點摘要 (Summary)。如果是清單就統整有什麼東西。
            2. 產生 2 到 4 個分類標籤 (Tags)，例如：靈感、待辦清單、食譜、科技知識。標籤必須非常簡短。
            3. 如果有提供圖片，請讀取圖片上的文字或形容圖片重點。如果有網址，請依照網址字面推測內容。
            
            回覆必須是純 JSON 格式，不要加入任何 Markdown 標記，格式如下：
            {"summary": "這是一段重點摘要...", "tags": ["標籤A", "標籤B"]}
            
            使用者輸入內容：
            "${text || '[只有提供圖片]'}"`;

            const payload = {
                contents: [{ role: "user", parts: [{ text: prompt }] }],
            };

            // 若有圖片則附加在 payload 中
            if (base64Img) {
                const b64Data = base64Img.split(',')[1];
                payload.contents[0].parts.push({
                    inlineData: { mimeType: "image/jpeg", data: b64Data }
                });
            }

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) throw new Error("API 呼叫失敗");
                const data = await response.json();
                let textRes = data.candidates[0].content.parts[0].text;
                // 去除可能產生的 ```json 標記
                textRes = textRes.replace(/```json/g, '').replace(/```/g, '').trim();
                return JSON.parse(textRes);
            } catch (err) {
                console.error(err);
                showToast("AI 分析失敗，已儲存原始筆記。");
                return { summary: "未自動解析的筆記", tags: ["未分類"] };
            }
        }

        // --- 儲存邏輯 ---
        async function saveBrainDump() {
            const textEl = document.getElementById('bd-text');
            if (!textEl.value.trim()) return;
            if (isListening) toggleMic();
            
            document.getElementById('bd-btn-text').innerText = "AI 處理中...";
            const aiRes = await analyzeWithAI(textEl.value.trim(), null);
            
            const newNote = {
                id: Date.now().toString(),
