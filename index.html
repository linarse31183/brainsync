<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>BrainSync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="data:application/manifest+json,{'name':'BrainSync','short_name':'BrainSync','display':'standalone','background_color':'#0a0f1d','theme_color':'#0a0f1d'}">
    <style>
        body { background-color: #0a0f1d; color: white; padding-bottom: 80px; font-family: sans-serif; }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        .nav-item { opacity: 0.4; transition: all 0.2s; }
        .nav-item.active { opacity: 1; transform: translateY(-2px); }
        .nav-item.active.nav-dump { color: #10b981; }
        .nav-item.active.nav-note { color: #3b82f6; }
        .nav-item.active.nav-library { color: #8b5cf6; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen">
    <!-- Header -->
    <header class="p-5 flex justify-between items-center bg-[#0a0f1d] sticky top-0 z-10">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <span class="bg-gradient-to-br from-teal-400 to-blue-500 rounded-lg p-1 text-sm text-black">🧠</span> BrainSync
        </h1>
        <button onclick="askApiKey()" class="text-gray-400 hover:text-white transition">⚙️ 設定</button>
    </header>

    <!-- Main Content Area -->
    <main class="p-5">
        <!-- 1. Brain Dump View -->
        <div id="view-dump" class="tab-content active">
            <h2 class="text-2xl font-bold mb-2">清空大腦</h2>
            <p class="text-gray-400 text-sm mb-5">快速記錄靈感、待辦事項。AI 會自動為你分類與摘要。</p>
            
            <div class="bg-[#151b2b] rounded-2xl p-4 border border-gray-800 focus-within:border-teal-500 transition">
                <textarea id="dump-text" class="w-full bg-transparent outline-none resize-none h-40 text-gray-200 placeholder-gray-600" placeholder="現在在想什麼？點擊下方麥克風直接用說的..."></textarea>
                <div class="flex justify-between items-center mt-3 pt-3 border-t border-gray-800">
                    <button onclick="startVoiceInput('dump-text')" id="mic-btn" class="w-10 h-10 rounded-full bg-gray-800 flex items-center justify-center text-xl text-teal-400 hover:bg-gray-700 transition">🎤</button>
                    <button onclick="saveNote('dump')" class="bg-[#059669] hover:bg-[#047857] text-white px-5 py-2 rounded-xl font-medium flex items-center gap-2 transition shadow-lg shadow-teal-900/50">
                        存入大腦 🚀
                    </button>
                </div>
            </div>
        </div>

        <!-- 2. Smart Note View -->
        <div id="view-note" class="tab-content">
            <h2 class="text-2xl font-bold mb-2">智慧筆記</h2>
            <p class="text-gray-400 text-sm mb-5">貼上長文、網址，或上傳圖片讓 AI 幫你萃取精華。</p>
            
            <div class="bg-[#151b2b] rounded-2xl p-4 border border-gray-800 focus-within:border-blue-500 transition">
                <textarea id="note-text" class="w-full bg-transparent outline-none resize-none h-48 text-gray-200 placeholder-gray-600" placeholder="在此貼上長篇文章、網址，或點下方相機上傳圖片..."></textarea>
                <div id="image-preview" class="mb-3 hidden">
                    <img id="preview-img" class="max-h-32 rounded-lg border border-gray-700 object-cover" />
                </div>
                <div class="flex justify-between items-center mt-3 pt-3 border-t border-gray-800">
                    <label class="cursor-pointer text-gray-400 text-xl px-2 hover:text-blue-400 transition flex items-center gap-1">
                        📷 <input type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                    </label>
                    <button onclick="saveNote('note')" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-xl font-medium transition shadow-lg shadow-blue-900/50">
                        AI 摘要並儲存 ✨
                    </button>
                </div>
            </div>
        </div>

        <!-- 3. Library View -->
        <div id="view-library" class="tab-content">
            <h2 class="text-2xl font-bold mb-5">私人知識庫</h2>
            <div id="library-list" class="space-y-4 pb-10">
                <!-- Notes will dynamically appear here -->
            </div>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 w-full bg-[#0a0f1d]/90 backdrop-blur-md border-t border-gray-800 flex justify-around p-3 pb-safe z-50">
        <button onclick="switchTab('dump')" id="nav-dump" class="nav-item nav-dump active flex flex-col items-center gap-1 w-20">
            <span class="text-2xl">🧠</span>
            <span class="text-[10px] font-medium tracking-wide">Brain Dump</span>
        </button>
        <button onclick="
