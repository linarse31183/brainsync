<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>BrainSync</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="data:application/manifest+json,{'name':'BrainSync','short_name':'BrainSync','display':'standalone','background_color':'#0a0f1d','theme_color':'#0a0f1d'}">
    <style>
        body { background-color: #0a0f1d; color: white; padding-bottom: 80px; font-family: sans-serif; }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        .nav-item { opacity: 0.4; transition: all 0.2s; }
        .nav-item.active { opacity: 1; transform: translateY(-2px); }
        .nav-item.active.nav-dump { color: #10b981; }
        .nav-item.active.nav-note { color: #3b82f6; }
        .nav-item.active.nav-library { color: #8b5cf6; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen">
    <!-- Header -->
    <header class="p-5 flex justify-between items-center bg-[#0a0f1d] sticky top-0 z-10">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <span class="bg-gradient-to-br from-teal-400 to-blue-500 rounded-lg p-1 text-sm text-black">🧠</span> BrainSync
        </h1>
        <button onclick="askApiKey()" class="text-gray-400 hover:text-white transition">⚙️ 設定</button>
    </header>

    <!-- Main Content Area -->
    <main class="p-5">
        <!-- 1. Brain Dump View -->
        <div id="view-dump" class="tab-content active">
            <h2 class="text-2xl font-bold mb-2">清空大腦</h2>
            <p class="text-gray-400 text-sm mb-5">快速記錄靈感、待辦事項。AI 會自動為你分類與摘要。</p>
            
            <div class="bg-[#151b2b] rounded-2xl p-4 border border-gray-800 focus-within:border-teal-500 transition">
                <textarea id="dump-text" class="w-full bg-transparent outline-none resize-none h-40 text-gray-200 placeholder-gray-600" placeholder="現在在想什麼？點擊下方麥克風直接用說的..."></textarea>
                <div class="flex justify-between items-center mt-3 pt-3 border-t border-gray-800">
                    <button class="w-10 h-10 rounded-full bg-gray-800 flex items-center justify-center text-xl text-teal-400 hover:bg-gray-700">🎤</button>
                    <button onclick="saveNote('dump')" class="bg-[#059669] hover:bg-[#047857] text-white px-5 py-2 rounded-xl font-medium flex items-center gap-2 transition shadow-lg shadow-teal-900/50">
                        存入大腦 🚀
                    </button>
                </div>
            </div>
        </div>

        <!-- 2. Smart Note View -->
        <div id="view-note" class="tab-content">
            <h2 class="text-2xl font-bold mb-2">智慧筆記</h2>
            <p class="text-gray-400 text-sm mb-5">貼上長文、網址，讓 AI 幫你萃取精華並自動上標籤。</p>
            
            <div class="bg-[#151b2b] rounded-2xl p-4 border border-gray-800 focus-within:border-blue-500 transition">
                <textarea id="note-text" class="w-full bg-transparent outline-none resize-none h-60 text-gray-200 placeholder-gray-600" placeholder="在此貼上長篇文章或複製的網址內容..."></textarea>
                <div class="flex justify-between items-center mt-3 pt-3 border-t border-gray-800">
                    <button class="text-gray-400 text-xl px-2 hover:text-blue-400">📷</button>
                    <button onclick="saveNote('note')" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-xl font-medium transition shadow-lg shadow-blue-900/50">
                        AI 摘要並儲存 ✨
                    </button>
                </div>
            </div>
        </div>

        <!-- 3. Library View -->
        <div id="view-library" class="tab-content">
            <h2 class="text-2xl font-bold mb-5">私人知識庫</h2>
            <div id="library-list" class="space-y-4 pb-10">
                <!-- Notes will dynamically appear here -->
            </div>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 w-full bg-[#0a0f1d]/90 backdrop-blur-md border-t border-gray-800 flex justify-around p-3 pb-safe z-50">
        <button onclick="switchTab('dump')" id="nav-dump" class="nav-item nav-dump active flex flex-col items-center gap-1 w-20">
            <span class="text-2xl">🧠</span>
            <span class="text-[10px] font-medium tracking-wide">Brain Dump</span>
        </button>
        <button onclick="switchTab('note')" id="nav-note" class="nav-item nav-note flex flex-col items-center gap-1 w-20">
            <span class="text-2xl">✨</span>
            <span class="text-[10px] font-medium tracking-wide">Smart Note</span>
        </button>
        <button onclick="switchTab('library')" id="nav-library" class="nav-item nav-library flex flex-col items-center gap-1 w-20">
            <span class="text-2xl">📚</span>
            <span class="text-[10px] font-medium tracking-wide">Library</span>
        </button>
    </nav>

    <script>
        let apiKey = localStorage.getItem('gemini_api_key');

        function askApiKey() {
            const key = prompt('請輸入您的 Gemini API Key (申請免費，資料僅存手機):', apiKey || '');
            if (key) {
                apiKey = key;
                localStorage.setItem('gemini_api_key', key);
                alert('API Key 已成功綁定本手機！');
            }
        }

        // Handle Tab Switching
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById('view-' + tabId).classList.add('active');
            document.getElementById('nav-' + tabId).classList.add('active');
            
            if (tabId === 'library') loadLibrary();
        }

        // Handle AI Summarization & Saving
        async function saveNote(type) {
            if (!apiKey) {
                askApiKey();
                if (!apiKey) return;
            }

            const inputId = type === 'dump' ? 'dump-text' : 'note-text';
            const content = document.getElementById(inputId).value;
            
            if (!content.trim()) return alert('請先輸入內容喔！');

            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            btn.innerHTML = 'AI 思考中... ⏳';
            btn.disabled = true;
            btn.style.opacity = '0.7';

            try {
                const prompt = type === 'dump' 
                    ? "這是一段簡短的隨手筆記或待辦事項。請直接給予1個最適合的分類標籤(以#開頭)，並適當潤飾語句使其清晰。內容：" + content
                    : "請將以下長文或知識進行結構化摘要(條列重點)，並在最後提供3個分類標籤(以#開頭)。內容：" + content;

                const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=' + apiKey, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                if(data.error) throw new Error(data.error.message);
                
                const aiResult = data.candidates[0].content.parts[0].text;
                
                // Save to LocalStorage
                const notes = JSON.parse(localStorage.getItem('brainsync_notes') || '[]');
                notes.unshift({
                    id: Date.now(),
                    original: content,
                    summary: aiResult,
                    date: new Date().toLocaleString('zh-TW', { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' }),
                    type: type
                });
                localStorage.setItem('brainsync_notes', JSON.stringify(notes));

                document.getElementById(inputId).value = '';
                
                // Jump to Library to see result
                switchTab('library');
                
            } catch (err) {
                alert('API 呼叫失敗，請檢查網路或 API Key 是否正確。詳細錯誤：' + err.message);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        }

        // Load Library Items
        function loadLibrary() {
            const notes = JSON.parse(localStorage.getItem('brainsync_notes') || '[]');
            const container = document.getElementById('library-list');
            
            if (notes.length === 0) {
                container.innerHTML = '<div class="text-center py-20 text-gray-500"><span class="text-4xl block mb-3">📭</span>你的知識庫目前空空的，趕快去存入大腦吧！</div>';
                return;
            }

            container.innerHTML = notes.map(note => `
                <div class="bg-[#151b2b] p-5 rounded-2xl border border-gray-800 shadow-sm relative">
                    <div class="absolute top-4 right-4 text-xs font-bold px-2 py-1 rounded bg-gray-800 text-gray-400">${note.type === 'dump' ? '🧠 Dump' : '✨ Note'}</div>
                    <div class="text-xs text-gray-500 mb-3">${note.date}</div>
                    <div class="text-gray-200 text-sm whitespace-pre-wrap mb-4 border-l-2 border-gray-700 pl-3">${note.original}</div>
                    <div class="bg-gray-800/50 p-3 rounded-xl border border-gray-700/50">
                        <div class="text-teal-300 text-sm whitespace-pre-wrap leading-relaxed">${note.summary}</div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
