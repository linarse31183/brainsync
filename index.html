<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>BrainSync - 個人智慧知識庫</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="data:application/manifest+json,{'name':'BrainSync','short_name':'BrainSync','display':'standalone','background_color':'#0a0f1d','theme_color':'#0a0f1d'}">
    <style>
        body { background-color: #0a0f1d; color: white; padding-bottom: 90px; font-family: sans-serif; }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        .nav-item { opacity: 0.4; transition: all 0.2s; }
        .nav-item.active { opacity: 1; transform: translateY(-2px); }
        .nav-item.active.nav-dump { color: #10b981; }
        .nav-item.active.nav-note { color: #3b82f6; }
        .nav-item.active.nav-library { color: #8b5cf6; }
        
        /* 內建排版樣式，確保穩定不當機 */
        .summary-box h3 { font-size: 1.1rem; font-weight: bold; color: #38bdf8; margin-top: 10px; margin-bottom: 4px; }
        .summary-box p { margin-bottom: 6px; line-height: 1.5; color: #e2e8f0; }
        .summary-box ul, .summary-box ol { padding-left: 20px; margin-bottom: 6px; }
        .summary-box li { margin-bottom: 4px; line-height: 1.4; color: #cbd5e1; }
        .summary-box strong { color: #f43f5e; font-weight: 600; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen">
    <!-- Header -->
    <header class="p-5 flex justify-between items-center bg-[#0a0f1d] sticky top-0 z-10 border-b border-gray-800/50">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <span class="bg-gradient-to-br from-teal-400 to-blue-500 rounded-lg p-1 text-sm text-black">🧠</span> BrainSync
        </h1>
        <button onclick="askApiKey()" class="text-gray-400 hover:text-white transition text-sm bg-gray-800/50 px-3 py-1.5 rounded-xl border border-gray-700">⚙️ 設定 API Key</button>
    </header>

    <!-- Main Content Area -->
    <main class="p-5">
        <!-- 1. Brain Dump View -->
        <div id="view-dump" class="tab-content active">
            <h2 class="text-2xl font-bold mb-2">清空大腦</h2>
            <p class="text-gray-400 text-sm mb-5">快速記錄靈感、短期待辦與採購清單。AI 會自動為你分類與潤飾。</p>
            
            <div class="bg-[#151b2b] rounded-2xl p-4 border border-gray-800 focus-within:border-teal-500 transition shadow-xl">
                <textarea id="dump-text" class="w-full bg-transparent outline-none resize-none h-44 text-gray-200 placeholder-gray-600" placeholder="現在在想什麼？點擊下方麥克風直接用說的..."></textarea>
                <div class="flex justify-between items-center mt-3 pt-3 border-t border-gray-800">
                    <button onclick="startVoiceInput('dump-text')" id="mic-btn" class="w-10 h-10 rounded-full bg-gray-800 flex items-center justify-center text-xl text-teal-400 hover:bg-gray-700 transition shadow">🎤</button>
                    <button onclick="saveNote('dump')" class="bg-[#059669] hover:bg-[#047857] text-white px-5 py-2.5 rounded-xl font-medium flex items-center gap-2 transition shadow-lg shadow-teal-900/50">
                        存入大腦 🚀
                    </button>
                </div>
            </div>
        </div>

        <!-- 2. Smart Note View -->
        <div id="view-note" class="tab-content">
            <h2 class="text-2xl font-bold mb-2">智慧筆記</h2>
            <p class="text-gray-400 text-sm mb-5">貼上長文、網址，或上傳圖片讓 AI 萃取重點與自動標籤。</p>
            
            <div class="bg-[#151b2b] rounded-2xl p-4 border border-gray-800 focus-within:border-blue-500 transition shadow-xl">
                <textarea id="note-text" class="w-full bg-transparent outline-none resize-none h-32 text-gray-200 placeholder-gray-600" placeholder="在此輸入補充說明，或直接上傳圖片..."></textarea>
                
                <div id="image-preview" class="mb-3 hidden">
                    <img id="preview-img" class="max-h-36 rounded-xl border border-gray-700 object-cover shadow" />
                </div>

                <div class="flex justify-between items-center mt-3 pt-3 border-t border-gray-800">
                    <label class="cursor-pointer text-gray-400 text-xl px-3 py-1.5 rounded-xl bg-gray-800 hover:bg-gray-700 hover:text-blue-400 transition flex items-center gap-1.5 text-sm">
                        📷 上傳圖片 <input type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                    </label>
                    <button onclick="saveNote('note')" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-medium transition shadow-lg shadow-blue-900/50">
                        AI 摘要並儲存 ✨
                    </button>
                </div>
            </div>
        </div>

        <!-- 3. Library View -->
        <div id="view-library" class="tab-content">
            <div class="flex justify-between items-center mb-5">
                <h2 class="text-2xl font-bold">私人知識庫</h2>
                <button onclick="clearLibrary()" class="text-xs text-red-400 hover:text-red-300 bg-red-950/30 px-3 py-1.5 rounded-lg border border-red-900/50">清空全部</button>
            </div>
            <div id="library-list" class="space-y-4 pb-10">
                <!-- 筆記列表會動態生成於此 -->
            </div>
        </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 w-full bg-[#0a0f1d]/95 backdrop-blur-md border-t border-gray-800 flex justify-around p-3 pb-safe z-50">
        <button onclick="switchTab('dump')" id="nav-dump" class="nav-item nav-dump active flex flex-col items-center gap-1 w-20 py-1">
            <span class="text-2xl">🧠</span>
            <span class="text-[11px] font-medium tracking-wide">Brain Dump</span>
        </button>
        <button onclick="switchTab('note')" id="nav-note" class="nav-item nav-note flex flex-col items-center gap-1 w-20 py-1">
            <span class="text-2xl">✨</span>
            <span class="text-[11px] font-medium tracking-wide">Smart Note</span>
        </button>
        <button onclick="switchTab('library')" id="nav-library" class="nav-item nav-library flex flex-col items-center gap-1 w-20 py-1">
            <span class="text-2xl">📚</span>
            <span class="text-[11px] font-medium tracking-wide">Library</span>
        </button>
    </nav>

    <script>
        let apiKey = localStorage.getItem('gemini_api_key');
        let uploadedImageBase64 = null;

        function askApiKey() {
            const key = prompt('請輸入您的 Gemini API Key (申請免費，資料僅存手機):', apiKey || '');
            if (key) {
                apiKey = key.trim();
                localStorage.setItem('gemini_api_key', apiKey);
                alert('API Key 已成功綁定本手機！');
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            document.getElementById('view-' + tabId).classList.add('active');
            document.getElementById('nav-' + tabId).classList.add('active');
            
            if (tabId === 'library') loadLibrary();
        }

        function startVoiceInput(targetId) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('您的瀏覽器不支援語音辨識功能，請使用 Google Chrome。');
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'zh-TW';
            recognition.interimResults = false;
            
            const micBtn = document.getElementById('mic-btn');
            micBtn.style.backgroundColor = '#ef4444';
            
            recognition.onresult = function(event) {
                const text = event.results[0][0].transcript;
                const textarea = document.getElementById(targetId);
                textarea.value += (textarea.value ? ' ' : '') + text;
                micBtn.style.backgroundColor = '';
            };
            
            recognition.onerror = function() { micBtn.style.backgroundColor = ''; };
            recognition.onend = function() { micBtn.style.backgroundColor = ''; };
            recognition.start();
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    
                    uploadedImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    const previewImg = document.getElementById('preview-img');
                    previewImg.src = uploadedImageBase64;
                    document.getElementById('image-preview').classList.remove('hidden');
                };
            };
            reader.readAsDataURL(file);
        }

        async function saveNote(type) {
            if (!apiKey) {
                askApiKey();
                if (!apiKey) return;
            }

            const inputId = type === 'dump' ? 'dump-text' : 'note-text';
            const content = document.getElementById(inputId).value;
            
            if (!content.trim() && !uploadedImageBase64) return alert('請先輸入內容或上傳圖片喔！');

            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            btn.innerHTML = 'AI 思考中... ⏳';
            btn.disabled = true;
            btn.style.opacity = '0.7';

            try {
                const promptText = type === 'dump' 
                    ? "這是一段隨手筆記或待辦事項。請直接給予1個最適合的分類標籤(以#開頭)，並適當潤飾語句。內容：" + content
                    : "請將以下長文、網址或圖片進行結構化重點摘要（條列重點與小標題），並在最後提供分類標籤(以#開頭)。內容：" + content;

                const targetModel = 'models/gemini-3.5-flash'; 

                let parts = [{ text: promptText }];
                if (uploadedImageBase64) {
                    parts.push({
                        inline_data: {
                            mime_type: "image/jpeg",
                            data: uploadedImageBase64.split(',')[1]
                        }
                    });
                }

                const response = await fetch('https://generativelanguage.googleapis.com/v1beta/' + targetModel + ':generateContent?key=' + apiKey, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: parts }] })
                });

                const data = await response.json();
                if(data.error) throw new Error(data.error.message);
                
                const aiResult = data.candidates[0].content.parts[0].text;
                
                const notes = JSON.parse(localStorage.getItem('brainsync_notes') || '[]');
                notes.unshift({
                    id: Date.now(),
                    original: content,
                    image: uploadedImageBase64,
                    summary: aiResult,
                    date: new Date().toLocaleString('zh-TW', { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' }),
                    type: type
                });
                localStorage.setItem('brainsync_notes', JSON.stringify(notes));

                document.getElementById(inputId).value = '';
                uploadedImageBase64 = null;
                document.getElementById('image-preview').classList.add('hidden');
                
                switchTab('library');
                
            } catch (err) {
                alert('連線失敗，詳細原因：' + err.message);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.style.opacity = '1';
            }
        }

        function loadLibrary() {
            const notes = JSON.parse(localStorage.getItem('brainsync_notes') || '[]');
            const container = document.getElementById('library-list');
            
            if (notes.length === 0) {
                container.innerHTML = '<div class="text-center py-20 text-gray-500"><span class="text-4xl block mb-3">📭</span>你的知識庫目前空空的，趕快去存入大腦吧！</div>';
                return;
            }

            container.innerHTML = notes.map(note => `
                <div class="bg-[#151b2b] p-5 rounded-2xl border border-gray-800 shadow-lg relative">
                    <button onclick="deleteNote(${note.id})" class="absolute top-4 right-12 text-gray-500 hover:text-red-400 text-xs px-2 py-1">刪除</button>
                    <div class="absolute top-4 right-4 text-xs font-bold px-2 py-0.5 rounded bg-gray-800 text-gray-400">${note.type === 'dump' ? '🧠 Dump' : '✨ Note'}</div>
                    <div class="text-xs text-gray-500 mb-3">${note.date}</div>
                    
                    ${note.original ? `<div class="text-gray-300 text-sm whitespace-pre-wrap mb-3 border-l-2 border-gray-700 pl-3">${note.original}</div>` : ''}
                    
                    ${note.image ? `
                        <div class="mb-4">
                            <a href="${note.image}" target="_blank">
                                <img src="${note.image}" class="max-h-40 rounded-xl border border-gray-700 object-cover shadow hover:opacity-90 transition" alt="原始圖片源頭" />
                            </a>
                            <div class="text-[10px] text-gray-500 mt-1">💡 點擊圖片可放大檢視原圖</div>
                        </div>
                    ` : ''}

                    <div class="bg-gray-800/60 p-4 rounded-xl border border-gray-700/50 summary-box">
                        <div class="text-teal-300 text-sm whitespace-pre-wrap leading-relaxed">${note.summary}</div>
                    </div>
                </div>
            `).join('');
        }

        function deleteNote(id) {
            let notes = JSON.parse(localStorage.getItem('brainsync_notes') || '[]');
            notes = notes.filter(n => n.id !== id);
            localStorage.setItem('brainsync_notes', JSON.stringify(notes));
            loadLibrary();
        }

        function clearLibrary() {
            if (confirm('確定要清空所有收藏的筆記嗎？')) {
                localStorage.removeItem('brainsync_notes');
                loadLibrary();
            }
        }
    </script>
</body>
</html>
