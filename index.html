<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>BrainSync - 個人智慧知識庫</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="data:application/manifest+json,{'name':'BrainSync','short_name':'BrainSync','display':'standalone','background_color':'#0a0f1d','theme_color':'#0a0f1d'}">
    <style>
        body { background-color: #0a0f1d; color: white; padding-bottom: 90px; font-family: sans-serif; }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        .nav-item { opacity: 0.4; transition: all 0.2s; }
        .nav-item.active { opacity: 1; transform: translateY(-2px); }
        .nav-item.active.nav-dump { color: #10b981; }
        .nav-item.active.nav-note { color: #3b82f6; }
        .nav-item.active.nav-library { color: #8b5cf6; }
        
        .summary-box { font-size: 1.1rem !important; line-height: 1.8 !important; color: #e2e8f0 !important; }
        .summary-box h3 { font-size: 1.3rem !important; font-weight: bold; color: #38bdf8 !important; margin-top: 14px; margin-bottom: 8px; }
        .summary-box p { margin-bottom: 10px; }
        .summary-box ul, .summary-box ol { padding-left: 24px; margin-bottom: 10px; }
        .summary-box li { margin-bottom: 8px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen">
    <header class="p-5 bg-[#0a0f1d] sticky top-0 z-10 border-b border-gray-800/50">
        <div class="flex justify-between items-center mb-3">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <span class="bg-gradient-to-br from-teal-400 to-blue-500 rounded-lg p-1 text-sm text-black">🧠</span> BrainSync
            </h1>
            <button onclick="askApiKey()" class="text-gray-400 hover:text-white transition text-xs bg-gray-800/50 px-3 py-1.5 rounded-xl border border-gray-700">⚙️ API Key</button>
        </div>
        <div id="hero-banner" onclick="switchTab('library')" class="bg-gradient-to-r from-blue-950/40 to-purple-950/40 border border-blue-900/40 rounded-xl p-3 text-xs text-gray-300 cursor-pointer shadow-inner hover:border-blue-700/60 transition">
            <div class="text-[10px] text-blue-400 font-bold mb-1 flex items-center gap-1">✨ 靈感隨機抽籤 (點擊查看全部)</div>
            <div id="hero-text" class="truncate text-base">載入中...</div>
        </div>
    </header>

    <main class="p-5">
        <div id="view-dump" class="tab-content active">
            <h2 class="text-2xl font-bold mb-2">清空大腦</h2>
            <p class="text-gray-400 text-sm mb-5">快速記錄靈感、短期待辦與採購清單。AI 會自動為你分類與潤飾。</p>
            
            <div class="bg-[#151b2b] rounded-2xl p-4 border border-gray-800 focus-within:border-teal-500 transition shadow-xl">
                <textarea id="dump-text" class="w-full bg-transparent outline-none resize-none h-44 text-lg text-gray-200 placeholder-gray-600" placeholder="現在在想什麼？點擊下方麥克風直接用說的..."></textarea>
                <div class="flex justify-between items-center mt-3 pt-3 border-t border-gray-800">
                    <button onclick="startVoiceInput('dump-text')" id="mic-btn" class="w-10 h-10 rounded-full bg-gray-800 flex items-center justify-center text-xl text-teal-400 hover:bg-gray-700 transition shadow">🎤</button>
                    <button onclick="saveNote('dump')" class="bg-[#059669] hover:bg-[#047857] text-white px-5 py-2.5 rounded-xl font-medium flex items-center gap-2 transition shadow-lg shadow-teal-900/50">
                        存入大腦 🚀
                    </button>
                </div>
            </div>
        </div>

        <div id="view-note" class="tab-content">
            <h2 class="text-2xl font-bold mb-2">智慧筆記</h2>
            <p class="text-gray-400 text-sm mb-5">貼上長文、網址，或**一次上傳多張圖片**讓 AI 綜合摘要。</p>
            
            <div class="bg-[#151b2b] rounded-2xl p-4 border border-gray-800 focus-within:border-blue-500 transition shadow-xl">
                <textarea id="note-text" class="w-full bg-transparent outline-none resize-none h-28 text-lg text-gray-200 placeholder-gray-600" placeholder="在此輸入補充說明，或上傳多張圖片討論整個主題..."></textarea>
                
                <div id="image-preview-container" class="flex gap-2 overflow-x-auto mb-3 pb-2 hidden"></div>

                <div class="flex justify-between items-center mt-3 pt-3 border-t border-gray-800">
                    <label class="cursor-pointer text-gray-300 text-sm px-3.5 py-2 rounded-xl bg-gray-800 hover:bg-gray-700 hover:text-blue-400 transition flex items-center gap-1.5">
                        📷 上傳多張圖片 <input type="file" accept="image/*" multiple class="hidden" onchange="handleImagesUpload(event)">
                    </label>
                    <button onclick="saveNote('note')" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-medium transition shadow-lg shadow-blue-900/50">
                        AI 綜合摘要 ✨
                    </button>
                </div>
            </div>
        </div>

        <div id="view-library" class="tab-content">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-2xl font-bold">私人知識庫</h2>
                <button onclick="clearLibrary()" class="text-xs text-red-400 hover:text-red-300 bg-red-950/30 px-3 py-1.5 rounded-lg border border-red-900/50">清空全部</button>
            </div>
            
            <div id="tag-filter-bar" class="flex gap-2 overflow-x-auto mb-4 pb-2"></div>
            <div id="library-list" class="space-y-4 pb-10"></div>
        </div>
    </main>

    <div id="image-modal" onclick="closeImageModal()" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4">
        <img id="modal-img" class="max-w-full max-h-full rounded-2xl border border-gray-700 shadow-2xl" />
    </div>

    <!-- 編輯內文與標籤 Modal -->
    <div id="edit-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#151b2b] w-full max-w-lg p-5 rounded-2xl border border-gray-800 shadow-2xl">
            <h3 class="text-lg font-bold mb-2 text-teal-400">✏️ 編輯筆記與標籤</h3>
            
            <label class="text-xs text-gray-400 block mb-1">標籤 (多個標籤請用空格隔開，例如: #生活 #工作)：</label>
            <input type="text" id="edit-tags-input" class="w-full bg-[#0a0f1d] border border-gray-700 rounded-xl p-3 text-base text-teal-300 outline-none mb-3" placeholder="#標籤">
            
            <p class="text-xs text-gray-400 mb-1">點擊下方現有標籤快速加入：</p>
            <div id="modal-tag-chips" class="flex gap-1.5 overflow-x-auto mb-3 pb-2"></div>

            <label class="text-xs text-gray-400 block mb-1">摘要內文：</label>
            <textarea id="edit-textarea" class="w-full bg-[#0a0f1d] border border-gray-700 rounded-xl p-3 text-base text-gray-200 h-36 outline-none mb-4"></textarea>
            
            <div class="flex justify-end gap-3">
                <button onclick="closeEditModal()" class="px-4 py-2 rounded-xl bg-gray-800 text-gray-300 hover:text-white text-sm">取消</button>
                <button onclick="saveEditedNote()" class="px-5 py-2 rounded-xl bg-teal-600 hover:bg-teal-500 text-white font-medium text-sm shadow">儲存修改</button>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 w-full bg-[#0a0f1d]/95 backdrop-blur-md border-t border-gray-800 flex justify-around p-3 pb-safe z-50">
        <button onclick="switchTab('dump')" id="nav-dump" class="nav-item nav-dump active flex flex-col items-center gap-1 w-20 py-1">
            <span class="text-2xl">🧠</span>
            <span class="text-[11px] font-medium tracking-wide">Brain Dump</span>
        </button>
        <button onclick="switchTab('note')" id="nav-note" class="nav-item nav-note flex flex-col items-center gap-1 w-20 py-1">
            <span class="text-2xl">✨</span>
            <span class="text-[11px] font-medium tracking-wide">Smart Note</span>
        </button>
        <button onclick="switchTab('library')" id="nav-library" class="nav-item nav-library flex flex-col items-center gap-1 w-20 py-1">
            <span class="text-2xl">📚</span>
            <span class="text-[11px] font-medium tracking-wide">Library</span>
        </button>
    </nav>

    <script>
        let apiKey = localStorage.getItem('gemini_api_key');
        let uploadedImagesBase64 = [];
        let currentEditingId = null;
        let activeTagFilter = null;

        function askApiKey() {
            const key = prompt('請輸入您的 Gemini API Key (申請免費，資料僅存手機):', apiKey || '');
            if (key) {
                apiKey = key.trim();
                localStorage.setItem('gemini_api_key', apiKey);
                alert('API Key 已成功綁定本手機！');
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const targetTab = document.getElementById('view-' + tabId);
            const targetNav = document.getElementById('nav-' + tabId);
            if (targetTab) targetTab.classList.add('active');
            if (targetNav) targetNav.classList.add('active');
            if (tabId === 'library') {
                activeTagFilter = null;
                loadLibrary();
            }
            updateHeroBanner();
        }

        function updateHeroBanner() {
            const notes = JSON.parse(localStorage.getItem('brainsync_notes') || '[]');
            const heroText = document.getElementById('hero-text');
            if (!heroText) return;
            if (notes.length === 0) {
                heroText.innerText = "目前知識庫空空如也，點此開始記錄靈感...";
                return;
            }
            const randomNote = notes[Math.floor(Math.random() * notes.length)];
            const cleanText = (randomNote.summary || '').replace(/[*`]/g, '').trim();
            heroText.innerText = cleanText.substring(0, 45) + '...';
        }

        function startVoiceInput(targetId) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { alert('您的瀏覽器不支援語音辨識。'); return; }
            const recognition = new SpeechRecognition();
            recognition.lang = 'zh-TW';
            const micBtn = document.getElementById('mic-btn');
            if (micBtn) micBtn.style.backgroundColor = '#ef4444';
            recognition.onresult = (e) => {
                const targetEl = document.getElementById(targetId);
                if (targetEl) targetEl.value += ' ' + e.results[0][0].transcript;
                if (micBtn) micBtn.style.backgroundColor = '';
            };
            recognition.onerror = () => { if (micBtn) micBtn.style.backgroundColor = ''; };
            recognition.onend = () => { if (micBtn) micBtn.style.backgroundColor = ''; };
            recognition.start();
        }

        function handleImagesUpload(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            const container = document.getElementById('image-preview-container');
            if (!container) return;
            container.classList.remove('hidden');
            container.innerHTML = '';

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * (MAX_WIDTH / img.width);
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        const resizedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                        
                        uploadedImagesBase64.push(resizedBase64);

                        const imgElement = document.createElement('img');
                        imgElement.src = resizedBase64;
                        imgElement.className = "h-16 w-16 rounded-lg border border-gray-700 object-cover shadow flex-shrink-0 cursor-pointer";
                        imgElement.onclick = () => openImageModal(resizedBase64);
                        container.appendChild(imgElement);
                    };
                };
                reader.readAsDataURL(file);
            });
        }

        function getExistingTags() {
            const notes = JSON.parse(localStorage.getItem('brainsync_notes') || '[]');
            let tags = new Set();
            notes.forEach(n => {
                if (n.tags && Array.isArray(n.tags)) {
                    n.tags.forEach(t => tags.add(t));
                }
            });
            return Array.from(tags);
        }

        async function saveNote(type) {
            if (!apiKey) { askApiKey(); if (!apiKey) return; }
            const inputId = type === 'dump' ? 'dump-text' : 'note-text';
            const inputEl = document.getElementById(inputId);
            const content = inputEl ? inputEl.value : '';
            if (!content.trim() && uploadedImagesBase64.length === 0) return alert('請先輸入內容或上傳圖片喔！');

            const btn = event.currentTarget;
            const orig = btn.innerHTML;
            btn.innerHTML = 'AI 綜合整理中... ⏳';
            btn.disabled = true;

            try {
                const existingTags = getExistingTags();
                let tagListStr = existingTags.length > 0 ? existingTags.join(', ') : '無';

                const promptText = `請將以下內容直接進行結構化重點摘要。絕對不要輸出任何像是「以下為您整理」或「結構化重點摘要」等開場白或贅字，直接以標題開頭即可。
現有標籤清單：[${tagListStr}]
請從現有標籤中選出 1 個最適合的分類，若完全不符合則自創一個簡短標籤（格式為 #標籤）。
請務必嚴格依照以下格式回傳：
【摘要】
(在此填入乾淨的重點摘要，包含小標題)

【標籤】
(#你的標籤)

內容：` + content;

                let parts = [{ text: promptText }];
                uploadedImagesBase64.forEach(imgBase64 => {
                    parts.push({ inline_data: { mime_type: "image/jpeg", data: imgBase64.split(',')[1] } });
                });

                const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=' + apiKey, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts }] })
                });

                const data = await res.json();
                if (data.error) throw new Error(data.error.message);

                const aiResponseText = data.candidates[0].content.parts[0].text;

                let summaryPart = aiResponseText;
                let extractedTags = ["#未分類"];

                if (aiResponseText.includes("【標籤】")) {
                    const partsSplit = aiResponseText.split("【標籤】");
                    summaryPart = partsSplit[0].replace("【摘要】", "").trim();
                    const tagString = partsSplit[1].trim();
                    const tagMatches = tagString.match(/#[a-zA-Z0-9\u4e00-\u9fa5_]+/g);
                    if (tagMatches && tagMatches.length > 0) {
                        extractedTags = tagMatches;
                    }
                } else {
                    const matches = aiResponseText.match(/#[a-zA-Z0-9\u4e00-\u9fa5_]+/g);
                    if (matches && matches.length > 0) {
                        extractedTags = [matches[matches.length - 1]];
                    }
                }

                const notes = JSON.parse(localStorage.getItem('brainsync_notes') || '[]');
                notes.unshift({
                    id: Date.now(),
                    original: content,
                    images: [...uploadedImagesBase64],
                    summary: summaryPart,
                    tags: extractedTags,
                    date: new Date().toLocaleString('zh-TW', { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' }),
                    type
                });
                localStorage.setItem('brainsync_notes', JSON.stringify(notes));

                if (inputEl) inputEl.value = '';
                uploadedImagesBase64 = [];
                const container = document.getElementById('image-preview-container');
                if (container) {
                    container.classList.add('hidden');
                    container.innerHTML = '';
                }
                
                switchTab('library');
            } catch (err) {
                alert('連線失敗：' + err.message);
            } finally {
                btn.innerHTML = orig;
                btn.disabled = false;
            }
        }

        function loadLibrary() {
            const notes = JSON.parse(localStorage.getItem('brainsync_notes') || '[]');
            const container = document.getElementById('library-list');
            const tagBar = document.getElementById('tag-filter-bar');
            if (!container || !tagBar) return;

            let allTags = new Set();
            notes.forEach(n => {
                if (n.tags && Array.isArray(n.tags)) {
                    n.tags.forEach(t => allTags.add(t));
                } else {
                    const matches = (n.summary || '').match(/#[a-zA-Z0-9\u4e00-\u9fa5_]+/g);
                    if (matches) matches.forEach(t => allTags.add(t));
                }
            });

            tagBar.innerHTML = `
                <button onclick="filterByTag(null)" class="text-sm px-4 py-2 rounded-xl whitespace-nowrap transition ${activeTagFilter === null ? 'bg-teal-600 text-white font-bold' : 'bg-gray-800 text-gray-300 hover:text-white'}">全部 (${notes.length})</button>
                ${Array.from(allTags).map(tag => `
                    <button onclick="filterByTag('${tag}')" class="text-sm px-4 py-2 rounded-xl whitespace-nowrap transition ${activeTagFilter === tag ? 'bg-teal-600 text-white font-bold' : 'bg-gray-800 text-gray-300 hover:text-white'}">${tag}</button>
                `).join('')}
            `;

            let filteredNotes = notes;
            if (activeTagFilter) {
                filteredNotes = notes.filter(n => {
                    if (n.tags && Array.isArray(n.tags)) {
                        return n.tags.includes(activeTagFilter);
                    }
                    return (n.summary || '').includes(activeTagFilter);
                });
            }

            if (filteredNotes.length === 0) {
                container.innerHTML = '<div class="text-center py-20 text-gray-400 text-base"><span class="text-4xl block mb-3">📭</span>沒有找到符合此標籤的筆記！你可以點擊右上角「編輯」手動補上標籤。</div>';
                return;
            }

            container.innerHTML = filteredNotes.map(n => {
                let noteTags = n.tags && Array.isArray(n.tags) ? n.tags : [];
                if (noteTags.length === 0) {
                    const matches = (n.summary || '').match(/#[a-zA-Z0-9\u4e00-\u9fa5_]+/g);
                    if (matches) noteTags = matches;
                }

                return `
                <div class="bg-[#151b2b] p-5 rounded-2xl border border-gray-800 shadow-lg relative">
                    <div class="absolute top-4 right-4 flex gap-2">
                        <button onclick="openEditModal(${n.id})" class="text-gray-300 hover:text-teal-300 text-xs px-3 py-1.5 bg-gray-800/90 rounded-lg">✏️ 編輯</button>
                        <button onclick="deleteNote(${n.id})" class="text-gray-300 hover:text-red-400 text-xs px-3 py-1.5 bg-gray-800/90 rounded-lg">刪除</button>
                    </div>
                    <div class="text-xs font-bold px-2.5 py-1 rounded bg-gray-800 text-gray-300 inline-block mb-2">${n.type === 'dump' ? '🧠 Dump' : '✨ Note'}</div>
                    <div class="text-xs text-gray-400 mb-3">${n.date}</div>

                    <div class="flex gap-1.5 mb-3 flex-wrap">
                        ${noteTags.map(t => `<span class="text-xs bg-teal-950/60 text-teal-300 border border-teal-800/50 px-2 py-0.5 rounded-md font-medium">${t}</span>`).join('')}
                    </div>

                    ${n.original ? `<div class="text-gray-200 text-lg whitespace-pre-wrap mb-3 border-l-2 border-gray-700 pl-3 leading-relaxed">${n.original}</div>` : ''}
                    
                    ${n.images && n.images.length > 0 ? `
                        <div class="mb-4 flex gap-2 overflow-x-auto pb-2">
                            ${n.images.map(img => `
                                <img src="${img}" onclick="openImageModal('${img}')" class="h-16 w-16 rounded-lg border border-gray-700 object-cover shadow cursor-pointer hover:opacity-90 transition flex-shrink-0" alt="原圖縮圖" />
                            `).join('')}
                        </div>
                    ` : ''}

                    <div class="bg-gray-800/60 p-4 rounded-xl border border-gray-700/50 summary-box">
                        <div class="text-teal-300 whitespace-pre-wrap">${n.summary}</div>
                    </div>
                </div>
            `;}).join('');
        }

        function filterByTag(tag) {
            activeTagFilter = tag;
            loadLibrary();
        }

        function openImageModal(src) {
            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-img');
            if (modal && modalImg) {
                modalImg.src = src;
                modal.classList.remove('hidden');
            }
        }
        function closeImageModal() {
            const modal = document.getElementById('image-modal');
            if (modal) modal.classList.add('hidden');
        }

        function openEditModal(id) {
            currentEditingId = id;
            const notes = JSON.parse(localStorage.getItem('brainsync_notes') || '[]');
            const note = notes.find(n => n.id === id);
            const textarea = document.getElementById('edit-textarea');
            const tagsInput = document.getElementById('edit-tags-input');
            const modal = document.getElementById('edit-modal');
            const tagChipsContainer = document.getElementById('modal-tag-chips');

            if (note && textarea && tagsInput && modal && tagChipsContainer) {
                textarea.value = note.summary;
                tagsInput.value = note.tags ? note.tags.join(' ') : '';
                
                const existingTags = getExistingTags();
                if (existingTags.length > 0) {
                    tagChipsContainer.innerHTML = existingTags.map(tag => `
                        <button type="button" onclick="appendTagToInput('${tag}')" class="text-xs bg-gray-800 hover:bg-teal-700 text-teal-300 hover:text-white px-2.5 py-1 rounded-lg whitespace-nowrap transition border border-gray-700">${tag}</button>
                    `).join('');
                } else {
                    tagChipsContainer.innerHTML = '<span class="text-xs text-gray-500">目前尚無其他現有標籤</span>';
                }

                modal.classList.remove('hidden');
            }
        }

        function appendTagToInput(tag) {
            const tagsInput = document.getElementById('edit-tags-input');
            if (tagsInput) {
                let currentTags = tagsInput.value.trim();
                if (!currentTags.includes(tag)) {
                    tagsInput.value = currentTags ? currentTags + ' ' + tag : tag;
                }
            }
        }

        function closeEditModal() {
            const modal = document.getElementById('edit-modal');
            if (modal) modal.classList.add('hidden');
            currentEditingId = null;
        }

        function saveEditedNote() {
            const textarea = document.getElementById('edit-textarea');
            const tagsInput = document.getElementById('edit-tags-input');
            if (!textarea || !tagsInput) return;

            const newText = textarea.value;
            const newTagsStr = tagsInput.value.trim();
            const newTags = newTagsStr ? newTagsStr.match(/#[a-zA-Z0-9\u4e00-\u9fa5_]+/g) || ["#未分類"] : ["#未分類"];

            let notes = JSON.parse(localStorage.getItem('brainsync_notes') || '[]');
            const index = notes.findIndex(n => n.id === currentEditingId);
            if (index !== -1) {
                notes[index].summary = newText;
                notes[index].tags = newTags;
                localStorage.setItem('brainsync_notes', JSON.stringify(notes));
                closeEditModal();
                loadLibrary();
                updateHeroBanner();
            }
        }

        function deleteNote(id) {
            if (confirm('確定要刪除這則筆記嗎？')) {
                let notes = JSON.parse(localStorage.getItem('brainsync_notes') || '[]');
                notes = notes.filter(n => n.id !== id);
                localStorage.setItem('brainsync_notes', JSON.stringify(notes));
                loadLibrary();
                updateHeroBanner();
            }
        }

        function clearLibrary() {
            if (confirm('確定要清空所有收藏的筆記嗎？')) {
                localStorage.removeItem('brainsync_notes');
                loadLibrary();
                updateHeroBanner();
            }
        }

        updateHeroBanner();
    </script>
</body>
</html>
